<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="code-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="code-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="code-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Shield/Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Left Bracket < (Cyan) -->
  <path d="M 21 21 L 11 32 L 21 43" fill="none" stroke="url(#code-cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / (Neon Pink) -->
  <path d="M 37 17 L 27 47" fill="none" stroke="url(#code-pink)" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Bracket > (Emerald Green) -->
  <path d="M 43 21 L 53 32 L 43 43" fill="none" stroke="url(#code-emerald)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Battle Spark (Top Right) -->
  <circle cx="49" cy="15" r="3" fill="#f43f5e"/>
</svg>